name: Update kids news feed

on:
  schedule:
    # 05:00, 11:00 and 16:00 UTC (06:00 / 12:00 / 17:00 in Amsterdam in winter)
    - cron: "0 5,11,16 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/feed.json
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
